trigger:
- main

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  - repository: buildTemplates
    type: git
    name: Engineering/DevOpsBuildTemplates
    ref: refs/heads/live

variables:
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'
  solutionPath: ''
  pathToPublish: $(Build.ArtifactStagingDirectory)

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    serviceTreeId: $(serviceTreeId)

    pool:
      name: $(oneEsPoolName)
      os: windows

    stages:
    - stage: Build
      jobs:
      - job: BuildAndTest
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: $(pathToPublish)
            artifactName: nugets

        steps:
        - template: stages/steps/cosmosDbEmulator.yml@buildTemplates

        - template: stages/steps/storageEmulator.yml@buildTemplates

        - template: stages/steps/dotnet.yml@buildTemplates
          parameters:
            version: '6.0.x'

        - template: stages/steps/dotnet.yml@buildTemplates
          parameters:
            version: '8.0.x'

        - template: stages/steps/buildProjects.yml@buildTemplates
          parameters:
            solutionPath: $(solutionPath)
            buildConfiguration: $(buildConfiguration)

        - task: Npm@1
          displayName: Install Azure Functions Core Tools v4
          inputs:
            command: custom
            verbose: false
            customCommand: 'install -g azure-functions-core-tools@4'

        - pwsh: |
            $npmRoot = npm root -g
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not determine the global npm modules directory.'
            }
            $hostPath = Join-Path $npmRoot 'azure-functions-core-tools\bin\func.exe'
            if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) {
              throw "Azure Functions Core Tools executable not found at '$hostPath'."
            }
            Write-Host "##vso[task.setvariable variable=FunctionsHostExePath]$hostPath"
          displayName: Configure FunctionsHostExePath from npm installation

        - template: stages/steps/storageEmulatorCheck.yml@buildTemplates

        - template: stages/steps/cosmosDbEmulatorCheck.yml@buildTemplates

        - template: stages/steps/test.yml@buildTemplates
          parameters:
            solutionPath: $(solutionPath)
            buildConfiguration: $(buildConfiguration)

        - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@6
          displayName: 'ESRP CodeSigning: Authenticode'
          inputs:
            ConnectedServiceName: $(esrpServiceConnection)
            AppRegistrationClientId: $(esrpManagedIdentityClientId)
            AppRegistrationTenantId: $(esrpTenantId)
            useMsiAuthentication: true
            esrpClientId: $(esrpClientId)
            AuthAKVName: $(esrpKeyVaultName)
            AuthSignCertName: $(esrpRequestSigningCertificateName)
            FolderPath: $(solutionPath)
            Pattern: 'Microsoft.Learn.*.dll'
            ServiceEndpointUrl: $(esrpServiceEndpointUrl)
            signConfigType: inlineSignParams
            inlineOperation: $(authenticodeSigningOperations)

        - task: DotNetCoreCLI@2
          displayName: Build NuGet packages
          inputs:
            command: pack
            packagesToPack: '$(solutionPath)**/Microsoft.Learn.AzureFunctionsTesting*.csproj'
            configuration: $(buildConfiguration)
            packDirectory: $(pathToPublish)
            nobuild: true

        - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@6
          displayName: 'ESRP CodeSigning: Nupkg'
          inputs:
            ConnectedServiceName: $(esrpServiceConnection)
            AppRegistrationClientId: $(esrpManagedIdentityClientId)
            AppRegistrationTenantId: $(esrpTenantId)
            useMsiAuthentication: true
            esrpClientId: $(esrpClientId)
            AuthAKVName: $(esrpKeyVaultName)
            AuthSignCertName: $(esrpRequestSigningCertificateName)
            FolderPath: $(pathToPublish)
            Pattern: '*.nupkg'
            ServiceEndpointUrl: $(esrpServiceEndpointUrl)
            signConfigType: inlineSignParams
            inlineOperation: $(nugetSigningOperations)
