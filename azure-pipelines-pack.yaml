resources:
  repositories:
    - repository: templates
      type: git
      name: Engineering/DevOpsBuildTemplates
      ref: 'refs/heads/live'

trigger:
- main

variables:
  vmImage: 'windows-2022'
  buildConfiguration: 'Release'
  dotNetVersion: '8.0.x'
  solutionPath: ''
  pathToPublish: $(Build.ArtifactStagingDirectory)
  FunctionsHostExeSha256: '9A01570CEB60F6B5DEE96C2686CB10F0F4566268BF97A7CFE243384647B3890A'

stages:
- stage: Build
  jobs:
  - job: 'BuildAndTest'
    pool:
      vmImage: $(vmImage)

    steps:
    - task: PowerShell@2
      displayName: 'Install and verify Azure Functions Core Tools'
      inputs:
        targetType: 'filePath'
        filePath: '$(Build.SourcesDirectory)\scripts\Install-VerifiedFunctionsCoreTools.ps1'
        arguments: '-Version "4.15.2" -ArchiveSha256 "3EED1467D4BDFA2E136EE2FBA4219F533290E42EEF64431D2ADEF28B6B3351B1" -ExecutableSha256 "$(FunctionsHostExeSha256)" -DestinationRoot "$(Agent.TempDirectory)"'
        pwsh: true

    - template: stages/steps/cosmosDbEmulator.yml@templates

    - pwsh: |
        $azuritePath = Join-Path $env:ProgramFiles 'Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions\Microsoft\Azure Storage Emulator\azurite.exe'
        if (-not (Test-Path -LiteralPath $azuritePath -PathType Leaf)) {
          throw "Azurite was not found at $azuritePath"
        }
        Write-Host "##vso[task.prependpath]$(Split-Path -Path $azuritePath -Parent)"
      displayName: 'Add Visual Studio Azurite to PATH'

    - template: stages/steps/storageEmulator.yml@templates

    - template: stages/steps/dotnet.yml@templates
      parameters:
        version: '6.0.x'

    - template: stages/steps/dotnet.yml@templates
      parameters:
        version: '8.0.x'

    - template: stages/steps/buildProjects.yml@templates
      parameters:
        solutionPath: $(solutionPath)
        buildConfiguration: $(buildConfiguration)

    - template: stages/steps/storageEmulatorCheck.yml@templates

    - template: stages/steps/cosmosDbEmulatorCheck.yml@templates

    - template: stages/steps/test.yml@templates
      parameters:
        solutionPath: $(solutionPath)
        buildConfiguration: $(buildConfiguration)

    # Authenticode sign all the DLLs with the Microsoft certificate
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP CodeSigning: Authenticode'
      inputs:
        ConnectedServiceName: 'Learn ESRP Code Signing'
        AppRegistrationClientId: '1a99b436-655d-4945-bf0f-9058f4e193fb' 
        AppRegistrationTenantId: '975f013f-7f24-47e8-a7d3-abc4752bf346' 
        AuthAKVName: 'learn-codesign-vault' 
        AuthCertName: 'AuthCert' 
        AuthSignCertName: 'RequestSigningCert'
        FolderPath: $(solutionPath)
        Pattern: 'Microsoft.Learn.*.dll'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
                "KeyCode": "CP-230012",
                "OperationCode": "SigntoolSign",
                "Parameters": {
                    "OpusName": "Microsoft",
                    "OpusInfo": "http://www.microsoft.com",
                    "FileDigest": "/fd \"SHA256\"",
                    "PageHash": "/NPH",
                    "TimeStamp": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                },
                "ToolName": "sign",
                "ToolVersion": "1.0"
              },
              {
                  "KeyCode": "CP-230012",
                  "OperationCode": "SigntoolVerify",
                  "Parameters": {},
                  "ToolName": "sign",
                  "ToolVersion": "1.0"
              }
          ]

    - task: DotNetCoreCLI@2
      displayName: Build NuGet packages
      inputs:
        command: 'pack'
        packagesToPack: '$(solutionPath)**/Microsoft.Learn.AzureFunctionsTesting*.csproj'
        configuration: '$(buildConfiguration)'
        packDirectory: '$(pathToPublish)'
        nobuild: true

    # Digitally sign all the nuget packages with the Microsoft certificate.
    - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
      displayName: 'ESRP CodeSigning: Nupkg'
      inputs:
        ConnectedServiceName: 'Learn ESRP Code Signing'
        AppRegistrationClientId: '1a99b436-655d-4945-bf0f-9058f4e193fb' 
        AppRegistrationTenantId: '975f013f-7f24-47e8-a7d3-abc4752bf346' 
        AuthAKVName: 'learn-codesign-vault' 
        AuthCertName: 'AuthCert' 
        AuthSignCertName: 'RequestSigningCert'
        FolderPath: $(pathToPublish)
        Pattern: '*.nupkg'
        signConfigType: inlineSignParams
        inlineOperation: |
          [
            {
              "KeyCode": "CP-401405",
              "OperationCode": "NuGetSign",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            },
            {
              "KeyCode": "CP-401405",
              "OperationCode": "NuGetVerify",
              "Parameters": {},
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - template: stages/steps/publishArtifact.yml@templates
      parameters:
        artifactName: 'nugets'
        pathToPublish: $(pathToPublish)
